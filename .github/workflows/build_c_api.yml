name: Build LiteRT-LM Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout LiteRT-LM
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Patch Android dependencies
        shell: powershell
        run: |
          $path = "WORKSPACE"

          Write-Host "Patching $path..."

          $text = Get-Content $path -Raw

          $text = $text -replace `
            'android_ndk_repository\(name = "androidndk"\)', `
            '# android_ndk_repository(name = "androidndk")'

          $text = $text -replace `
            'android_sdk_repository\(name = "androidsdk"\)', `
            '# android_sdk_repository(name = "androidsdk")'

          Set-Content $path $text

          Write-Host "Checking patch:"
          Select-String -Path $path -Pattern "android_ndk_repository|android_sdk_repository"

      - name: Build LiteRT-LM C API
        shell: powershell
        run: |
          bazelisk build //c:litert-lm `
            --config=windows `
            --verbose_failures

      - name: Locate build output
        shell: powershell
        run: |
          Write-Host "Searching bazel-bin..."

          Get-ChildItem `
            -Recurse `
            bazel-bin `
            -Include *.dll,*.lib `
            -ErrorAction SilentlyContinue

      - name: Collect binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output

          Copy-Item `
            bazel-bin\c\*.dll `
            output\ `
            -ErrorAction SilentlyContinue

          Copy-Item `
            bazel-bin\c\*.lib `
            output\ `
            -ErrorAction SilentlyContinue

          # LiteRT runtime dependencies
          Copy-Item `
            prebuilt\windows_x86_64\*.dll `
            output\ `
            -ErrorAction SilentlyContinue

          Write-Host "Final files:"
          Get-ChildItem output

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: litert-lm-windows-x86_64
          path: output

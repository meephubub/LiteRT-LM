name: Build LiteRT-LM Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout LiteRT-LM
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM
          path: LiteRT-LM

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Build LiteRT-LM C API
        shell: powershell
        run: |
          cd LiteRT-LM
          bazelisk build //c:litert-lm --config=windows --verbose_failures

      - name: Inspect output
        shell: powershell
        run: |
          Get-ChildItem -Recurse LiteRT-LM\bazel-bin\c

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: litert-lm-windows-x86_64
          path: |
            LiteRT-LM/bazel-bin/c/**
